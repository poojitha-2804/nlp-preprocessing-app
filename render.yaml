services:
  - type: web
    name: nlp-preprocessing-app
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        value: nlp_preprocess_secret_key_2026
